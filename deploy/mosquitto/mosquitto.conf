# Funcionalidad: Configuración del broker Mosquitto
# Descripción: Broker MQTT del ventilador físico con autenticación obligatoria por archivo de contraseñas, ACL por tópico, persistencia en volumen y registro por salida estándar
# Versión: 1.0
# Autor: Marcela Mazo Castro
# Proyecto: VentyLab
# Tesis: Desarrollo de una aplicación web para la enseñanza de mecánica ventilatoria que integre un sistema de retroalimentación usando modelos de lenguaje
# Institución: Universidad del Valle
# Contacto: marcela.mazo@correounivalle.edu.co

per_listener_settings false
allow_anonymous false

# Generated at startup by the mosquitto-auth service (deploy/mosquitto/generate-passwd.sh) from environment variables.
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

listener 1883

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
