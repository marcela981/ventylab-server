# Funcionalidad: Integración continua del backend
# Descripción: Ejecuta npm run verify (tipos, lint, ciclos, prisma, deriva de migraciones y contrato, pruebas con testcontainers sobre el Docker del runner) y la compilación en cada push y pull request; en main construye la imagen Docker y solo la publica en GHCR si la variable del repositorio PUBLISH_IMAGE vale true, pasando el commit y la fecha de construcción como argumentos GIT_SHA y BUILD_DATE; el job deploy, solo en push a main y tras verify, pide el despliegue a Dokploy (API o webhook de despliegue, desde secretos) y, sin secretos configurados, avisa y termina en verde
# Versión: 1.3
# Autor: Marcela Mazo Castro
# Proyecto: VentyLab
# Tesis: Desarrollo de una aplicación web para la enseñanza de mecánica ventilatoria que integre un sistema de retroalimentación usando modelos de lenguaje
# Institución: Universidad del Valle
# Contacto: marcela.mazo@correounivalle.edu.co

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Docker is preinstalled on ubuntu runners; verify starts throwaway Postgres/Mosquitto containers through it.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Publishing is opt-in: set the repository variable PUBLISH_IMAGE=true (Settings > Variables) to push to GHCR.
      PUBLISH: ${{ vars.PUBLISH_IMAGE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only when PUBLISH_IMAGE is true)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image and reported by GET /api/version.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Controlled deploy: Dokploy only deploys a main commit that passed verify (runbook section 8).
  # Preferred: the Dokploy API (works with Auto Deploy OFF) when DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_APPLICATION_ID are set.
  # Otherwise: the deploy webhook in DOKPLOY_DEPLOY_WEBHOOK. Neither configured: warn and succeed.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
    steps:
      - name: Trigger Dokploy deploy
        shell: bash
        run: |
          set -euo pipefail

          # URLs and the key are never echoed (curl runs without --show-error): the log shows only the HTTP status,
          # curl's exit code and Dokploy's short message. Connection errors, timeouts, 408, 429 and 5xx are retried.
          post() {
            local url="$1" payload="$2"
            shift 2
            rm -f response.txt
            curl --silent --fail-with-body --retry 3 --retry-connrefused --retry-delay 10 --connect-timeout 15 --max-time 60 \
              --output response.txt --write-out '%{http_code}' \
              -X POST -H 'Content-Type: application/json' "$@" --data "$payload" "$url"
          }

          status=""
          rc=0

          if [ -n "${DOKPLOY_URL:-}" ] && [ -n "${DOKPLOY_API_KEY:-}" ] && [ -n "${DOKPLOY_APPLICATION_ID:-}" ]; then
            mode="API"
            payload="$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" --arg title "CI ${GITHUB_SHA::7}" --arg sha "$GITHUB_SHA" '{applicationId: $id, title: $title, description: $sha}')"
            status="$(post "${DOKPLOY_URL%/}/api/application.deploy" "$payload" -H "x-api-key: ${DOKPLOY_API_KEY}")" || rc=$?
          elif [ -n "${DOKPLOY_DEPLOY_WEBHOOK:-}" ]; then
            mode="webhook"
            # Dokploy's webhook reads a push-shaped body: its ref must match the branch configured in Dokploy.
            payload="$(jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" '{ref: $ref, after: $sha, head_commit: {id: $sha, message: ("CI " + $sha[0:7])}, commits: []}')"
            status="$(post "$DOKPLOY_DEPLOY_WEBHOOK" "$payload" -H 'X-GitHub-Event: push')" || rc=$?
          else
            echo "::warning title=Deploy skipped::No Dokploy deploy secret is configured (DOKPLOY_DEPLOY_WEBHOOK, or DOKPLOY_URL + DOKPLOY_API_KEY + DOKPLOY_APPLICATION_ID). Deploy manually from Dokploy (runbook section 8)."
            exit 0
          fi

          # Dokploy answers 301 (not a redirect) for "Branch Not Match"/"Watch Paths Not Match": only 2xx means the deploy was queued.
          case "$status" in
            2??) echo "Dokploy queued the deploy of ${GITHUB_SHA} through the ${mode} (HTTP ${status}). Check GET /api/version for the new sha." ;;
            *) echo "::error title=Deploy failed::Dokploy ${mode} answered HTTP ${status:-none} (curl exit ${rc}): $(head -c 300 response.txt 2>/dev/null || true)"; exit 1 ;;
          esac
